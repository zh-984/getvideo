<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 破防盗链核心：不发送 Referer，绕过 CDN 的 Referer 校验 -->
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF8F6" id="meta-theme">
<title>GetVideo — 高清轻量影视聚合</title>
<script>
  // 双 CDN 容灾加载播放器库（非阻塞首屏）
  function loadScriptWithFallback(urls){
    return new Promise((resolve, reject) => {
      let i = 0;
      function tryNext(){
        if (i >= urls.length) return reject(new Error('播放器库加载失败'));
        const s = document.createElement('script');
        s.src = urls[i++];
        s.async = true;
        s.onload = resolve;
        s.onerror = () => { s.remove(); tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    });
  }
  let _libsPromise = null;
  function ensurePlayerLibs(){
    if (window.Hls && window.Artplayer) return Promise.resolve();
    if (!_libsPromise) {
      _libsPromise = Promise.all([
        loadScriptWithFallback([
          'https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js',
          'https://unpkg.com/hls.js@1.5.20/dist/hls.min.js'
        ]),
        loadScriptWithFallback([
          'https://cdn.jsdelivr.net/npm/artplayer@5.2.3/dist/artplayer.js',
          'https://unpkg.com/artplayer@5.2.3/dist/artplayer.js'
        ])
      ]).catch(err => { _libsPromise = null; throw err; });
    }
    return _libsPromise;
  }
  setTimeout(() => { ensurePlayerLibs().catch(() => {}); }, 1200);
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFF8F6;--bg-glass:rgba(255,248,246,.92);--card:#FFFFFF;--card2:#FFF2EE;
  --pink:#FFB5C2;--pink-d:#FF8FA3;--mint:#5EC49D;--mint-soft:#B5EAD7;
  --lavender:#A78BDB;--sky:#7BC4DE;--peach:#FFDAB9;
  --text:#4A4A5E;--text2:#88889E;--text3:#B6B6C8;--border:#F0E6E2;
  --shadow:0 3px 14px rgba(255,150,170,.12);--r:14px;
}
html.dark{
  --bg:#12131A;--bg-glass:rgba(18,19,26,.92);--card:#1C1E29;--card2:#252838;
  --pink:#FF8FA3;--pink-d:#FF6B88;--mint:#5EC49D;--mint-soft:#2B4C40;
  --lavender:#9B7FE0;--sky:#67B4D4;--peach:#6E513E;
  --text:#ECEEF5;--text2:#A0A5BA;--text3:#6C7188;--border:#2B2E40;
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
html,body{
  min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
}
input,button{font-family:inherit;outline:none;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

.wrap{max-width:1160px;margin:0 auto}

/* ── 顶栏 ── */
.hdr{
  position:sticky;top:0;z-index:50;padding:12px 18px;
  background:var(--bg-glass);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
.hdr-in{max-width:1160px;margin:0 auto}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-size:19px;font-weight:800;letter-spacing:-.5px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.logo b{color:var(--pink-d)}.logo .logo-v{color:var(--mint)}
.logo small{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--text2);letter-spacing:0}
.hdr-acts{display:flex;align-items:center;gap:8px}
.ibtn{
  height:32px;padding:0 11px;border-radius:16px;font-size:12px;font-weight:600;
  background:var(--card);border:1px solid var(--border);color:var(--text2);
  cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .18s;
}
.ibtn:hover{border-color:var(--pink);color:var(--pink-d)}
.ibtn:active{transform:scale(.94)}

.srow{display:flex;gap:10px;position:relative}
.sinp{
  flex:1;height:40px;padding:0 16px;border-radius:20px;background:var(--card);
  color:var(--text);font-size:13.5px;font-weight:500;border:1.5px solid var(--border);
  transition:all .2s;box-shadow:var(--shadow);
}
.sinp:focus{border-color:var(--pink-d);box-shadow:0 0 0 3px rgba(255,143,163,.18)}
.sinp::placeholder{color:var(--text3)}
.sbtn{
  height:40px;padding:0 22px;border-radius:20px;
  background:linear-gradient(135deg,var(--pink),var(--pink-d));
  color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;
  box-shadow:0 3px 12px rgba(255,143,163,.32);white-space:nowrap;
}
.sbtn:active{transform:scale(.95)}.sbtn:disabled{opacity:.55;transform:none}

/* ── 搜索建议下拉 ── */
.suggest-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;right:82px;z-index:60;
  background:var(--card);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.14);
  max-height:260px;overflow-y:auto;border:1px solid var(--border);display:none;
}
.suggest-item{
  padding:10px 16px;font-size:13px;color:var(--text);cursor:pointer;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover,.suggest-item:active{background:var(--card2)}
.suggest-icon{color:var(--text3);font-size:11px;flex-shrink:0}

/* ── 区块标题 ── */
.sec{padding:16px 18px 8px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-title{font-size:14.5px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:6px}
.sec-sub{font-size:11px;color:var(--text3);font-weight:500}
.sec-tabs{display:flex;gap:6px;flex-wrap:wrap}
.stab{
  padding:5px 12px;border-radius:14px;font-size:11.5px;font-weight:600;cursor:pointer;
  background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .15s;
}
.stab.on{background:linear-gradient(135deg,var(--pink),var(--pink-d));border-color:transparent;color:#fff}

/* ── 热门标签 & 历史 ── */
.hero{text-align:center;padding:24px 18px 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tag{padding:7px 14px;border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;transition:all .18s}
.tag:nth-child(6n+1){background:rgba(255,143,163,.16);color:#e6677f}
.tag:nth-child(6n+2){background:rgba(125,212,176,.18);color:#3da379}
.tag:nth-child(6n+3){background:rgba(167,139,219,.18);color:#8a68c7}
.tag:nth-child(6n+4){background:rgba(240,175,115,.18);color:#cf823c}
.tag:nth-child(6n+5){background:rgba(123,196,222,.2);color:#4292b2}
.tag:nth-child(6n+6){background:rgba(225,195,90,.2);color:#ab902b}
.tag:active{transform:scale(.93)}

.hist{margin:16px auto 0;max-width:780px}
.hist-head{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;color:var(--text2);font-weight:600}
.hist-clear{font-size:11px;color:var(--text3);cursor:pointer;padding:2px 9px;border-radius:10px;background:var(--card);border:1px solid var(--border)}
.hist-clear:hover{border-color:var(--pink-d);color:var(--pink-d)}
.hist-list{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.hist-item{
  padding:5px 11px;border-radius:14px;font-size:11.5px;font-weight:500;
  background:var(--card);color:var(--text2);cursor:pointer;border:1px solid var(--border);transition:all .15s;
}
.hist-item:hover{border-color:var(--pink);color:var(--pink-d)}

/* ── 继续观看横滑栏 ── */
.recents{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.rcard{
  flex:0 0 185px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;position:relative;transition:transform .16s;box-shadow:var(--shadow);
}
.rcard:hover{transform:translateY(-2px)}
.rcard-top{display:flex;gap:10px;padding:9px}
.rcard-img{width:46px;height:64px;border-radius:7px;object-fit:cover;background:var(--card2);flex-shrink:0}
.rcard-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.rcard-t{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard-m{font-size:10.5px;color:var(--pink-d);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard-s{font-size:10px;color:var(--text3)}
.rcard-bar{height:3px;background:var(--border);width:100%}
.rcard-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--mint))}
.rcard-del{
  position:absolute;top:5px;right:6px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.35);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;
  opacity:.75;cursor:pointer;
}
.rcard-del:hover{opacity:1;background:var(--pink-d)}

/* ── 影片网格 ── */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:4px 18px 28px}
@media(max-width:960px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(max-width:768px){.grid{grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 12px 22px}}
@media(max-width:460px){.grid{grid-template-columns:repeat(3,1fr);gap:8px}}

.cd{
  background:var(--card);border-radius:11px;overflow:hidden;cursor:pointer;
  transition:transform .18s,box-shadow .18s;border:1px solid var(--border);box-shadow:var(--shadow);
}
.cd:hover{transform:translateY(-3px)}
.cd:active{transform:scale(.96)}
.cd-wrap{position:relative}
.cd-img{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--card2);display:block}
.cd-src{
  position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:6px;
  background:rgba(0,0,0,.68);backdrop-filter:blur(4px);color:#fff;font-size:9.5px;font-weight:700;
}
.cd-rem{
  position:absolute;bottom:6px;right:6px;max-width:calc(100% - 12px);
  padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.7);color:#fff;
  font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cd-pg{
  position:absolute;top:6px;right:6px;padding:2px 6px;border-radius:6px;
  background:linear-gradient(135deg,var(--pink-d),var(--lavender));color:#fff;font-size:9px;font-weight:700;
}
.cd-bd{padding:7px 8px 9px}
.cd-t{
  font-size:12px;font-weight:700;color:var(--text);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px;
}
.cd-m{margin-top:3px;font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 空状态与加载 ── */
.empty,.ld{text-align:center;padding:56px 20px}
.ei{font-size:48px;margin-bottom:14px}
.et{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px}
.es{font-size:12px;color:var(--text3)}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.dot{width:10px;height:10px;border-radius:50%;animation:bounce 1.2s infinite}
.dot:nth-child(1){background:var(--pink);animation-delay:0s}
.dot:nth-child(2){background:var(--mint);animation-delay:.15s}
.dot:nth-child(3){background:var(--lavender);animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-11px)}}

/* ── 播放页 ── */
.play-wrap{max-width:980px;margin:0 auto;padding-bottom:28px}
.nav{display:flex;align-items:center;gap:10px;padding:12px 18px}
.nb{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--lavender),var(--sky));
  color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(167,139,219,.3);
}
.nb:active{transform:scale(.9)}
.nt{font-size:15px;font-weight:800;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-badges{display:flex;align-items:center;gap:6px;flex-shrink:0}
.q-badge{
  padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:800;
  background:linear-gradient(135deg,var(--mint),#3ba77f);color:#fff;display:none;
}
.nt-sub{font-size:11.5px;color:var(--text3);font-weight:600}

.ply-outer{padding:0 18px}
@media(max-width:640px){.ply-outer{padding:0}}
.ply{
  position:relative;width:100%;background:#0B0C10;aspect-ratio:16/9;max-height:66vh;
  overflow:hidden;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);
}
@media(max-width:640px){.ply{border-radius:0;max-height:52vh}}
.ply .artplayer-app{width:100%!important;height:100%!important}
.ply-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;background:rgba(11,12,16,.88);color:#fff;z-index:5;padding:20px;text-align:center;
}
.ply-overlay p{font-size:13px;color:#cfd4e6;max-width:340px;line-height:1.5}
.ply-overlay .retry-btn{
  padding:8px 18px;border-radius:20px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),var(--pink-d));box-shadow:0 4px 14px rgba(255,107,136,.35);
}

body:not(.state-playing) .artplayer-app,
body:not(.state-playing) video,
body:not(.state-playing) iframe,
body:not(.state-playing) [class*="art-"]{
  display:none!important;visibility:hidden!important;opacity:0!important;
  pointer-events:none!important;position:fixed!important;top:-9999px!important;left:-9999px!important;
  width:0!important;height:0!important;z-index:-9999!important;overflow:hidden!important;
}

.warn{
  display:flex;align-items:center;gap:8px;padding:8px 14px;margin:10px 18px 0;border-radius:10px;
  background:rgba(255,143,163,.12);border:1px solid rgba(255,143,163,.25);
}
.warn-text{font-size:11px;color:var(--pink-d);font-weight:500;line-height:1.4;flex:1}
.warn-close{font-size:14px;color:var(--text3);cursor:pointer;padding:2px 4px}

.tbar{display:flex;gap:7px;align-items:center;padding:12px 18px 6px;overflow-x:auto;flex-wrap:wrap}
.pl{
  padding:6px 12px;border-radius:14px;font-size:11.5px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .16s;background:var(--card);color:var(--text2);border:1.5px solid var(--border);
}
.pl:hover{border-color:var(--pink)}
.pl:active{transform:scale(.94)}
.pl.on{background:linear-gradient(135deg,var(--mint),#46b086);border-color:transparent;color:#fff}
.pl.act{background:linear-gradient(135deg,var(--pink),var(--pink-d));border-color:transparent;color:#fff}
.pl.proxy-on{background:linear-gradient(135deg,var(--lavender),#8666cf);border-color:transparent;color:#fff}

/* ── 线路切换栏（带实时探活状态） ── */
.src-bar{padding:8px 18px 4px}
.src-hd{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.src-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.src-pill{
  padding:6px 12px;border-radius:12px;font-size:11.5px;font-weight:600;cursor:pointer;
  white-space:nowrap;background:var(--card);color:var(--text2);border:1.5px solid var(--border);
  transition:all .15s;display:inline-flex;align-items:center;gap:5px;
}
.src-pill:hover{border-color:var(--pink)}
.src-pill.on{background:linear-gradient(135deg,var(--pink),var(--pink-d));border-color:transparent;color:#fff}
.src-pill.dead{opacity:.48;text-decoration:line-through}
.src-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--text3)}
.src-dot.ok{background:#4cd995}
.src-dot.proxy{background:#a78bdb}
.src-dot.dead{background:#ff6b81}
.src-pill small{opacity:.85;font-weight:500;font-size:10.5px}

/* ── 选集面板 ── */
.ep{padding:10px 18px 14px}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.eh h3{font-size:13.5px;font-weight:800;color:var(--text)}
.eh-right{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text3)}
.sort-btn{
  padding:3px 9px;border-radius:10px;background:var(--card);border:1px solid var(--border);
  color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;
}
.sort-btn:hover{border-color:var(--pink);color:var(--pink-d)}
.ew{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:220px;overflow-y:auto;padding-right:2px}
.ec{
  padding:8px 8px;border-radius:10px;font-size:11.5px;font-weight:600;cursor:pointer;
  transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
  background:var(--card);color:var(--text2);border:1.5px solid var(--border);
}
.ec:hover{border-color:var(--pink)}
.ec.on{background:linear-gradient(135deg,var(--pink),var(--pink-d));border-color:transparent;color:#fff;box-shadow:0 2px 10px rgba(255,143,163,.3)}

.blurb{
  margin:4px 18px 12px;padding:11px 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--border);font-size:12px;line-height:1.65;color:var(--text2);
}
.kb-hint{text-align:center;font-size:11px;color:var(--text3);padding:0 18px 8px}
@media(max-width:768px){.kb-hint{display:none}}

.db{text-align:center;padding:4px 18px 8px}
.db button{font-size:11px;color:var(--text3);cursor:pointer;font-weight:500}
.dbox{
  margin:0 18px 16px;padding:10px 12px;border-radius:10px;background:var(--card);
  border:1px solid var(--border);max-height:130px;overflow-y:auto;
  font-family:'SF Mono',Consolas,monospace;font-size:10.5px;line-height:1.7;
}
.d-ok{color:#5bb88a}.d-w{color:#d0a030}.d-e{color:#e07080}.d-i{color:#67b4d4}.d-t{color:var(--text3);margin-right:4px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-in">
    <div class="hdr-top">
      <div class="logo" onclick="backToHome()"><span><b>G</b>et<span class="logo-v">V</span>ideo</span><small>v4.3</small></div>
      <div class="hdr-acts">
        <button class="ibtn" id="theme-btn" onclick="toggleTheme()" title="切换深色/浅色主题">🌙 深色</button>
      </div>
    </div>
    <div class="srow">
      <input id="kw" class="sinp" type="search" inputmode="search" placeholder="搜索电影、电视剧、动漫、综艺…" autocomplete="off">
      <button id="sbtn" class="sbtn" onclick="hideSuggestions();doSearch()">搜索</button>
    </div>
  </div>
</div>

<div id="app" class="wrap"></div>

<script>
const API = '';
let art = null, hls = null, state = 'idle';
let results = [], resultCat = 'all', filteredOutCount = 0, latestAll = [], latestCat = 'all';
let film = null, curSrc = 0, curEp = 0, eps = [], epReverse = false;
let probeMap = {};       // srcIdx -> { ok, dead, ms, resolution }
let failedSources = new Set(); // 当前集已验证不可用的 srcIdx
let _playToken = 0, _resumeTimer = null;
let logs = [], searchHistory = [], playProgress = {}, recentFilms = [];

const $app = document.getElementById('app');
const $kw = document.getElementById('kw');
const $sbtn = document.getElementById('sbtn');
const $themeBtn = document.getElementById('theme-btn');

// ── 主题管理 ──
function applyTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  $themeBtn.textContent = dark ? '☀️ 浅色' : '🌙 深色';
  document.getElementById('meta-theme').setAttribute('content', dark ? '#12131A' : '#FFF8F6');
}
(function initTheme(){
  const saved = localStorage.getItem('gv_theme');
  const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(dark);
})();
function toggleTheme(){
  const next = !document.documentElement.classList.contains('dark');
  applyTheme(next);
  try { localStorage.setItem('gv_theme', next ? 'dark' : 'light'); } catch {}
}

// ── 本地存储 ──

function saveProgress(title, epIdx, time, duration, label, siteName) {
  if (!title) return;
  const t = Math.floor(time || 0);
  const dur = Math.floor(duration || 0);
  const prev = playProgress[title];
  if (prev && prev.ep === epIdx && Math.abs(prev.time - t) < 3 && prev.site === siteName) return;

  playProgress[title] = { ep: epIdx, time: t, duration: dur, label: label || '', site: siteName || '', ts: Date.now() };
  const keys = Object.keys(playProgress);
  if (keys.length > 100) {
    keys.sort((a, b) => (playProgress[b].ts || 0) - (playProgress[a].ts || 0));
    keys.slice(100).forEach(k => delete playProgress[k]);
  }
  try { localStorage.setItem('gv_progress', JSON.stringify(playProgress)); } catch {}
}

// ── 多源聚合去重：按「纯片名 + 分类」合并，按相关度绝对优先排序 ──
function groupResults(list) {
  const map = new Map();
  for (const item of list || []) {
    if (!item?.title || !item.episodes?.length) continue;
    const cleanName = item.title
      .replace(/[\s\u3000·•・：:，,。\.！!？\?、\-—_()（）\[\]【】《》]/g, '')
      .toLowerCase();
    // 区分电影/剧集/动漫，防止同名剧集与同名动漫被合并串台
    const cat = item.category || 'other';
    const key = `${cleanName}::${cat}`;
    const existing = map.get(key);
    const firstUrl = item.episodes[0]?.url || '';
    const rel = typeof item.relevance === 'number' ? item.relevance : 50;
    const srcObj = {
      site: item.site,
      priority: item.priority ?? 50,
      preferProxy: Boolean(item.preferProxy),
      remarks: item.remarks || '',
      episodes: item.episodes,
      _firstUrl: firstUrl,
    };
    if (!existing) {
      map.set(key, {
        title: item.title,
        cover: item.cover || null,
        year: item.year || '',
        type: item.type || '',
        category: cat,
        remarks: item.remarks || '',
        snippet: item.snippet || '',
        blurb: item.blurb || '',
        relevance: rel,
        sources: [srcObj],
      });
    } else {
      if (rel > existing.relevance) existing.relevance = rel;
      if (!existing.cover && item.cover) existing.cover = item.cover;
      if (!existing.blurb && item.blurb) existing.blurb = item.blurb;
      if (!existing.remarks && item.remarks) existing.remarks = item.remarks;
      const dup = existing.sources.some(s => s.site === item.site || (firstUrl && s._firstUrl === firstUrl));
      if (!dup) existing.sources.push(srcObj);
    }
  }
  const grouped = [...map.values()];
  grouped.forEach(g => {
    g.sources.sort((a, b) => {
      if ((b.priority ?? 50) !== (a.priority ?? 50)) return (b.priority ?? 50) - (a.priority ?? 50);
      return b.episodes.length - a.episodes.length;
    });
  });
  grouped.sort((a, b) => {
    // 1. 相关度分档优先（精确匹配 > 前缀匹配 > 包含 > 别名/演员）
    if (b.relevance !== a.relevance) return b.relevance - a.relevance;
    // 2. 高质量直连源数量优先
    const aHigh = a.sources.filter(s => (s.priority ?? 50) >= 70).length;
    const bHigh = b.sources.filter(s => (s.priority ?? 50) >= 70).length;
    if (bHigh !== aHigh) return bHigh - aHigh;
    if (b.sources.length !== a.sources.length) return b.sources.length - a.sources.length;
    return (b.sources[0]?.episodes.length || 0) - (a.sources[0]?.episodes.length || 0);
  });
  return grouped;
}

const _searchCache = new Map();
const _CACHE_MS = 3 * 60 * 1000;
const HOT_WORDS = ['蜘蛛侠','哈利波特','三体','甄嬛传','你的名字','灌篮高手','流浪地球','复仇者联盟','海贼王','火影忍者','阿凡达','庆余年','进击的巨人','权力的游戏','黑客帝国','疯狂动物城'];
const HOT_WORDS_LOWER = HOT_WORDS.map(w => w.toLowerCase());

let _suggestTimer = null;
$kw.addEventListener('keyup', e => { if (e.key === 'Enter') { hideSuggestions(); doSearch(); } });
$kw.addEventListener('focus', () => { if ($kw.value.trim()) showSuggestions($kw.value.trim()); });
$kw.addEventListener('blur', () => { setTimeout(hideSuggestions, 180); });
$kw.addEventListener('input', () => {

function showSuggestions(q) {
  const qLow = q.toLowerCase();
  const fromHistory = searchHistory.filter(h => h.toLowerCase().includes(qLow) && h.toLowerCase() !== qLow);
  const fromHot = HOT_WORDS.filter((w, i) => HOT_WORDS_LOWER[i].includes(qLow) && !fromHistory.includes(w));
  const merged = [...fromHistory, ...fromHot].slice(0, 8);
  if (!merged.length) { hideSuggestions(); return; }

  let box = document.getElementById('suggest-box');
  if (!box) {
    box = document.createElement('div');
    box.id = 'suggest-box';
    box.className = 'suggest-dropdown';
    document.querySelector('.srow').appendChild(box);
  }
  const qReg = new RegExp(`(${escRegex(esc(q))})`, 'gi');
  box.innerHTML = merged.map(w => {
    const wEsc = esc(w);
    const icon = fromHistory.includes(w) ? '🕐' : '🔥';
    return `<div class="suggest-item" data-kw="${wEsc}"><span class="suggest-icon">${icon}</span><span>${wEsc.replace(qReg, '<b style="color:var(--pink-d)">$1</b>')}</span></div>`;
  }).join('');

}

// ── 搜索（带请求取消与竞态保护） ──
let _searchToken = 0;
let _searchCtrl = null;
async function doSearch(customKw) {
  if (typeof customKw === 'string') $kw.value = customKw;
  const kw = $kw.value.trim();
  if (!kw) return;
  if (_searchCtrl) { try { _searchCtrl.abort(); } catch {} _searchCtrl = null; }
  const mySearchToken = ++_searchToken;
  saveHistory(kw);
  saveCurrentBeforeLeave();
  destroyPlayer();
  pushPage('results');

  const cacheKey = kw.toLowerCase();
  const cached = _searchCache.get(cacheKey);
  if (cached && Date.now() - cached.t < _CACHE_MS) {
    results = cached.d;
    filteredOutCount = cached.f || 0;
    resultCat = 'all';
    state = 'results';
    $sbtn.disabled = false;
    $sbtn.textContent = '搜索';
    render();
    return;
  }

  $sbtn.disabled = true;
  $sbtn.textContent = '搜索中…';
  resultCat = 'all';
  filteredOutCount = 0;
  state = 'searching';
  render();

  const ctrl = new AbortController();
  _searchCtrl = ctrl;
  try {
    const r = await fetch(`${API}/api/search?keyword=${encodeURIComponent(kw)}`, { signal: ctrl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (mySearchToken !== _searchToken || state !== 'searching') return;
    results = groupResults(d.results || []);
    filteredOutCount = d.filteredOut || 0;
    if (results.length) _searchCache.set(cacheKey, { d: results, f: filteredOutCount, t: Date.now() });
    state = 'results';
    log('ok', `搜索 "${kw}"：精准匹配 ${results.length} 部（已过滤 ${filteredOutCount} 条无关噪点）`);
  } catch (e) {
    if (e.name === 'AbortError' || mySearchToken !== _searchToken) return;
    log('err', '搜索失败: ' + e.message);
    state = 'results';
    results = [];
  } finally {
    if (mySearchToken === _searchToken) {
      _searchCtrl = null;
      $sbtn.disabled = false;
      $sbtn.textContent = '搜索';
      if (state === 'results') render();
    }
  }
}

// ── 并发线路体检与智能选优 ──
async function probeSourcesForEp(epIdx, preferredSite = '') {
  if (!film?.sources?.length) return null;
  const probeToken = _playToken;
  const reqUrls = [];
  const srcIndices = [];

  film.sources.forEach((s, idx) => {
    const targetEp = s.episodes?.[epIdx] || s.episodes?.[Math.min(epIdx, s.episodes.length - 1)];
    if (targetEp?.url) {
      reqUrls.push(targetEp.url);
      srcIndices.push(idx);
    }
  });
  if (!reqUrls.length) return null;

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 3200);
  try {
    const resp = await fetch(`${API}/api/probe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls: reqUrls }),
      signal: ctrl.signal,
    });
    if (!resp.ok) return null;
    const data = await resp.json();
    if (probeToken !== _playToken || state !== 'playing') return null;
    const list = data.results || [];

    probeMap = {};
    list.forEach((pr, i) => {
      const sIdx = srcIndices[i];
      probeMap[sIdx] = pr;
      if (pr.dead) failedSources.add(sIdx);
    });
    updateSourcePillsUI();

    // 挑选最佳可用直连线路：尊重上次线路(若可用) > 分辨率高 > 站点权重/延迟
    const okCandidates = srcIndices
      .map(sIdx => ({ sIdx, src: film.sources[sIdx], pr: probeMap[sIdx] }))
      .filter(x => x.pr?.ok);

    if (!okCandidates.length) {
      const unverified = srcIndices.filter(sIdx => !failedSources.has(sIdx));
      if (!unverified.length) return { allDead: true };
      return { fallbackIdx: unverified.includes(curSrc) ? curSrc : unverified[0] };
    }

    if (preferredSite) {
      const match = okCandidates.find(x => x.src.site === preferredSite);
      if (match) return { bestIdx: match.sIdx, resolution: match.pr.resolution || '', ms: match.pr.ms || 0 };
    }

    okCandidates.sort((a, b) => {
      const resScore = r => r === '4K' ? 4 : r === '1080P' ? 3 : r === '720P' ? 2 : r ? 1 : 0;
      const dr = resScore(b.pr.resolution) - resScore(a.pr.resolution);
      if (dr !== 0) return dr;
      const dp = (b.src.priority ?? 50) - (a.src.priority ?? 50);
      if (Math.abs(dp) >= 15) return dp;
      return (a.pr.ms || 9999) - (b.pr.ms || 9999);
    });

    const best = okCandidates[0];
    return {
      bestIdx: best.sIdx,
      resolution: best.pr.resolution || '',
      ms: best.pr.ms || 0,
    };
  } catch {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function updateSourcePillsUI() {
  const listEl = document.querySelector('.src-list');
  if (!listEl || !film?.sources) return;
  listEl.innerHTML = renderSourcePills();
}

function renderSourcePills() {
  if (!film?.sources) return '';
  return film.sources.map((s, i) => {
    const pr = probeMap[i];
    const isDead = failedSources.has(i) || pr?.dead;
    let dotCls = '';
    let meta = `${s.episodes.length}集`;
    if (isDead) {
      dotCls = 'dead';
      meta = '失效';
    } else if (pr?.ok) {
      dotCls = 'ok';
      const parts = [];
      if (pr.resolution) parts.push(pr.resolution);
      if (pr.ms) parts.push(`${pr.ms}ms`);
      if (parts.length) meta = parts.join('·');
    } else if (pr) {
      meta = '待验证';
    }
    return `<button class="src-pill ${i === curSrc ? 'on' : ''} ${isDead ? 'dead' : ''}" onclick="switchSource(${i})">
      <i class="src-dot ${dotCls}"></i>${esc(s.site)}<small>${esc(meta)}</small>
    </button>`;
  }).join('');
}

// ── 进入播放页（自动并发测活选出最稳直连高清源） ──
async function openFilm(item) {
  if (!item?.sources?.length) return;
  const openToken = ++_playToken;
  pushPage('playing');
  film = item;
  epReverse = false;
  logs = [];
  probeMap = {};
  failedSources = new Set();
  saveRecentFilm(item);

  const pg = getProgress(film.title);
  let initSrc = 0;
  if (pg?.site) {
    const found = film.sources.findIndex(s => s.site === pg.site);
    if (found >= 0) initSrc = found;
  }
  curSrc = initSrc;
  eps = film.sources[curSrc]?.episodes || [];
  curEp = pg ? Math.min(Math.max(0, pg.ep || 0), Math.max(0, eps.length - 1)) : 0;
  state = 'playing';

  log('info', `${film.title} · 共 ${film.sources.length} 条直连线路`);
  render();

  const seekTime = pg && pg.time > 10 ? pg.time : 0;

  if (film.sources.length === 1) {
    if (eps.length) playEp(curEp, seekTime);
    return;
  }

  setPlayerOverlay(`<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><p>正在检测 ${film.sources.length} 条直连线路可用性与画质…</p>`);

  const probeRes = await probeSourcesForEp(curEp, pg?.site || '');
  if (openToken !== _playToken || state !== 'playing') return;

  if (probeRes?.allDead) {
    log('err', '所有直连线路体检均不可用');
    showAllDeadOverlay();
    return;
  }

  const selectedIdx = probeRes?.bestIdx ?? probeRes?.fallbackIdx;
  if (typeof selectedIdx === 'number' && selectedIdx !== curSrc) {
    curSrc = selectedIdx;
    eps = film.sources[curSrc].episodes || [];
    curEp = Math.min(curEp, Math.max(0, eps.length - 1));
    syncPlayerMetaUI();
  }
  if (typeof probeRes?.bestIdx === 'number') {
    log('ok', `已自动优选「${film.sources[curSrc].site}」${probeRes.resolution ? ' ' + probeRes.resolution : ''} (${probeRes.ms}ms · 直连 CDN)`);
  }

  setPlayerOverlay(null);
  if (eps.length) {
    playEp(curEp, seekTime);
  }
}

function getFilteredResults() {
  if (resultCat === 'all') return results;
  return results.filter(item => item.category === resultCat);
}
function setResultCat(cat) {
  resultCat = cat;
  if (state === 'results') render();
}
function selectFilm(idx) { openFilm(getFilteredResults()[idx]); }
function playLatest(idx) { openFilm(getFilteredLatest()[idx]); }
function playRecent(idx) { openFilm(recentFilms[idx]); }

function syncPlayerMetaUI() {
  const ew = document.querySelector('.ew');
  if (ew) ew.innerHTML = renderEpisodeButtons();
  const cnt = document.getElementById('ep-count');
  if (cnt) cnt.textContent = `共 ${eps.length} 集`;
  const sbtn = document.querySelector('.sort-btn');
  if (sbtn) sbtn.style.display = eps.length > 1 ? '' : 'none';
  updateSourcePillsUI();
  updateActiveEpUI();
}

function switchSource(newSrcIdx) {
  if (!film?.sources?.[newSrcIdx]) return;
  const keepTime = art?.video?.currentTime > 5 ? art.video.currentTime : 0;
  curSrc = newSrcIdx;
  eps = film.sources[curSrc].episodes || [];
  curEp = Math.min(curEp, Math.max(0, eps.length - 1));
  setPlayerOverlay(null);
  showToast(`已切换至「${film.sources[curSrc].site}」`);
  log('info', `手动换源 → ${film.sources[curSrc].site}`);
  syncPlayerMetaUI();
  playEp(curEp, keepTime);
}

function toggleEpSort() {
  epReverse = !epReverse;
  const ew = document.querySelector('.ew');
  const btn = document.querySelector('.sort-btn');
  if (ew) ew.innerHTML = renderEpisodeButtons();
  if (btn) btn.textContent = epReverse ? '↓ 倒序' : '↑ 正序';
}

function renderEpisodeButtons() {
  const orderedEps = eps.map((ep, idx) => ({ ep, idx }));
  if (epReverse) orderedEps.reverse();
  return orderedEps
    .map(({ ep, idx }) => `<span class="ec ${idx === curEp ? 'on' : ''}" data-idx="${idx}" onclick="playEp(${idx})">${esc(ep.label || String(idx + 1))}</span>`)
    .join('');
}

function playNextEp() {
  if (curEp < eps.length - 1) playEp(curEp + 1);
}

// ── 播放器销毁与返回 ──
function destroyPlayer() {
  _playToken++;
  releasePlayer();
}

function releasePlayer() {
  const player = art;
  const engine = hls;
  const box = document.getElementById('player-box');
  const video = player?.video || box?.querySelector('video');
  art = null;
  hls = null;
  clearInterval(_resumeTimer);
  _resumeTimer = null;
  setPlayerOverlay(null);

  if (video) {
    try { video.pause(); } catch {}
    if (document.pictureInPictureElement === video) {
      try { document.exitPictureInPicture?.()?.catch(() => {}); } catch {}
    }
    if (video.webkitPresentationMode && video.webkitPresentationMode !== 'inline') {
      try { video.webkitSetPresentationMode?.('inline'); } catch {}
    }
    if (video.webkitDisplayingFullscreen) {
      try { video.webkitExitFullscreen?.(); } catch {}
    }
  }
  const fullscreen = document.fullscreenElement || document.webkitFullscreenElement;
  if (fullscreen && (fullscreen === video || box?.contains(fullscreen))) {
    try {
      if (document.fullscreenElement) document.exitFullscreen?.()?.catch(() => {});
      else document.webkitExitFullscreen?.();
    } catch {}
  }
  try { if (player?.mini) player.mini = false; } catch {}
  try { if (player?.fullscreenWeb) player.fullscreenWeb = false; } catch {}
  try { engine?.destroy(); } catch {}

  if (video) {
    video.autoplay = false;
    video.controls = false;
    video.disablePictureInPicture = true;
    video.style.display = 'none';
    video.removeAttribute('src');
    video.querySelectorAll('source').forEach(source => source.remove());
    if (video.srcObject) video.srcObject = null;
    try { video.load(); } catch {}
  }
  try { player?.destroy(); } catch {}
  // Artplayer 销毁时会重新写入空 src，再移除一次以免触发媒体加载。
  if (video?.hasAttribute('src')) {
    video.removeAttribute('src');
    try { video.load(); } catch {}
  }
  box?.replaceChildren();
}

function saveCurrentBeforeLeave() {
  if (film?.title && art?.video) {
    const srcName = film.sources?.[curSrc]?.site || '';
    saveProgress(film.title, curEp, art.video.currentTime, art.video.duration, eps[curEp]?.label, srcName);
  }
}
function backToResults() {
  if (_searchCtrl) { try { _searchCtrl.abort(); } catch {} _searchCtrl = null; }
  _searchToken++;
  saveCurrentBeforeLeave();
  destroyPlayer();
  film = null; eps = [];
  state = results.length ? 'results' : 'idle';
  $sbtn.disabled = false;
  $sbtn.textContent = '搜索';
  render();
}
function backToHome() {
  if (_searchCtrl) { try { _searchCtrl.abort(); } catch {} _searchCtrl = null; }
  _searchToken++;
  saveCurrentBeforeLeave();
  destroyPlayer();
  film = null; eps = []; results = [];
  state = 'idle';
  $sbtn.disabled = false;
  $sbtn.textContent = '搜索';
  render();
}

// ── 播放指定分集（纯零流量直连 CDN） ──
function playEp(idx, seekTo = 0) {
  const ep = eps[idx];
  if (!ep?.url) return;
  if (idx !== curEp) {
    failedSources = new Set();
    probeMap = {};
    updateSourcePillsUI();
  }
  curEp = idx;

  setPlayerOverlay(null);
  updateQualityBadge('');
  updateActiveEpUI();

  let playUrl = ep.url;
  const isM3u8 = /\.m3u8(\?|$|#)/i.test(playUrl);
  if (isM3u8) {
    playUrl = `${API}/api/m3u8?url=${encodeURIComponent(playUrl)}`;
    log('ok', `[${film?.sources?.[curSrc]?.site || ''}] #${idx + 1} ${ep.label} · 直连 CDN`);
  } else {
    log('ok', `#${idx + 1} ${ep.label} · 直链视频`);
  }

  initPlayer(playUrl, seekTo);
}

function updateQualityBadge(text) {
  const q = document.getElementById('q-badge');
  if (!q) return;
  if (text) { q.textContent = text; q.style.display = 'inline-block'; }
  else { q.style.display = 'none'; }
}

function updateActiveEpUI() {
  document.querySelectorAll('.ec').forEach(el => {
    el.classList.toggle('on', Number(el.dataset.idx) === curEp);
  });
  const sub = document.querySelector('.nt-sub');
  if (sub && eps[curEp]) sub.textContent = eps[curEp].label || `第${curEp + 1}集`;
  const nbtn = document.getElementById('next-ep-btn');
  if (nbtn) nbtn.style.display = curEp < eps.length - 1 ? '' : 'none';
}

// ── 毫秒级自动换源（零流量：绝不切代理，直接换下一条可用直连线路） ──
function fallbackFromError() {
  const keepTime = art?.video?.currentTime > 5 ? art.video.currentTime : 0;

  failedSources.add(curSrc);
  updateSourcePillsUI();

  if (film?.sources?.length > 1) {
    const nextIdx = film.sources.findIndex((_, i) => !failedSources.has(i));
    if (nextIdx >= 0) {
      const nextSite = film.sources[nextIdx].site;
      showToast(`当前线路不可用，自动切换至「${nextSite}」…`);
      log('warn', `线路失效 → 自动换源 [${nextSite}]`);
      curSrc = nextIdx;
      eps = film.sources[curSrc].episodes || [];
      curEp = Math.min(curEp, Math.max(0, eps.length - 1));
      syncPlayerMetaUI();
      playEp(curEp, keepTime);
      return true;
    }
  }

  log('err', '当前影片所有自带直连线路均不可用');
  showAllDeadOverlay();
  return false;
}

// ── 初始化 ArtPlayer + hls.js（强化稳定与卡顿自愈） ──
async function initPlayer(source, seekTo = 0) {
  const myToken = ++_playToken;
  const isCurrent = () => myToken === _playToken && state === 'playing';
  releasePlayer();
  try {
    await ensurePlayerLibs();
  } catch (err) {
    if (!isCurrent()) return;
    showToast('播放器脚本加载失败，请刷新重试');
    log('err', err.message);
    return;
  }
  if (!isCurrent()) return;

  const box = document.getElementById('player-box');
  if (!box) return;

  const prepareVideo = video => {
    if (!isCurrent() || !box.contains(video)) return false;
    video.playsInline = true;
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('x5-video-player-type', 'h5-page');
    return true;
  };

  const isM3u8 = typeof source === 'string' && (source.includes('.m3u8') || source.includes('/api/m3u8'));
  let mediaRecoveryCount = 0;
  let stallRecoverCount = 0;

  const player = new Artplayer({
    container: box,
    url: source,
    type: isM3u8 ? 'm3u8' : 'mp4',
    autoplay: true,
    autoSize: false,
    autoMini: true,
    loop: false,
    flip: true,
    playbackRate: true,
    aspectRatio: true,
    fullscreen: true,
    fullscreenWeb: true,
    miniProgressBar: true,
    mutex: true,
    backdrop: true,
    playsInline: true,
    pip: true,
    theme: '#FF8FA3',
    lang: navigator.language.includes('zh') ? 'zh-cn' : 'en',
    customType: {
      mp4(video, url) {
        if (prepareVideo(video)) video.src = url;
      },
      m3u8(video, url, owner) {
        if (!prepareVideo(video)) return;
        if (!Hls.isSupported()) {
          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
          } else {
            log('err', '当前浏览器不支持 HLS 播放');
          }
          return;
        }
        const engine = new Hls({
          maxBufferLength: 60,
          maxMaxBufferLength: 120,
          maxBufferHole: 0.8,
          nudgeOffset: 0.2,
          nudgeMaxRetry: 5,
          enableWorker: true,
          stretchShortVideoTrack: true,
          forceKeyFrameOnDiscontinuity: true,
          lowLatencyMode: false,
          manifestLoadingMaxRetry: 1,
          manifestLoadingTimeOut: 9000,
          levelLoadingMaxRetry: 1,
          fragLoadingMaxRetry: 4,
          fragLoadingTimeOut: 15000,
        });
        hls = engine;
        owner.hls = engine;
        engine.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
          if (!isCurrent() || hls !== engine) return;
          video.play().catch(() => {});
          const lv = data?.levels?.[0];
          if (lv?.width || lv?.height) updateQualityBadge(formatQuality(lv.width, lv.height));
          log('ok', '✓ 清单就绪（直连 CDN）');
        });
        let fragCount = 0;
        engine.on(Hls.Events.FRAG_LOADED, () => {
          if (!isCurrent() || hls !== engine) return;
          fragCount++;
          stallRecoverCount = 0;
          if (fragCount === 1 || fragCount % 50 === 0) log('ok', `✓ 已加载 ${fragCount} 个分片`);
        });
        engine.on(Hls.Events.ERROR, (_, d) => {
          if (!isCurrent() || hls !== engine) return;
          const code = d.response?.code || 0;
          log(d.fatal ? 'err' : 'warn', `hls: ${d.details} (code=${code}) fatal=${d.fatal}`);

          // 非致命卡顿自动跳过损坏微空洞
          if (!d.fatal) {
            if (d.details === 'bufferStalledError' && stallRecoverCount < 3 && video.currentTime > 0 && !video.paused) {
              stallRecoverCount++;
              video.currentTime += 0.35;
              log('warn', '缓冲微卡顿，已自动微调跳过损坏帧');
            }
            return;
          }

          if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRecoveryCount < 2) {
            mediaRecoveryCount++;
            engine.recoverMediaError();
            return;
          }

          fallbackFromError();
        });
        engine.loadSource(url);
        engine.attachMedia(video);
      },
    },
  });
  art = player;

  player.on('video:loadedmetadata', () => {
    if (isCurrent() && (player.video.videoWidth || player.video.videoHeight)) {
      updateQualityBadge(formatQuality(player.video.videoWidth, player.video.videoHeight));
    }
  });
  player.on('video:playing', () => {
    if (isCurrent()) log('ok', '▶ 正在播放');
  });
  player.on('video:ended', () => {
    if (isCurrent() && curEp < eps.length - 1) {
      showToast(`即将自动连播：${eps[curEp + 1]?.label || '下一集'}`);
      playEp(curEp + 1);
    }
  });
  player.on('videoPlaybackRate', r => {
    if (!isCurrent()) return;
    document.querySelectorAll('.pl[data-s]').forEach(e => e.classList.toggle('on', +e.dataset.s === r));
  });
  player.video.addEventListener('pause', () => {
    if (isCurrent()) saveCurrentBeforeLeave();
  });

  if (seekTo > 5) {
    const deadline = Date.now() + 10000;
    const resumeTimer = setInterval(() => {
      if (!isCurrent() || Date.now() >= deadline) return clearInterval(resumeTimer);
      if (!(player.video.duration > 0)) return;
      player.video.currentTime = Math.min(seekTo, Math.max(0, player.video.duration - 5));
      showToast('已续播至 ' + formatTime(seekTo));
      clearInterval(resumeTimer);
    }, 400);
    _resumeTimer = resumeTimer;
  }
}

function setSpeed(s) { if (art) art.playbackRate = s; }
function toggleDebug() {
  const p = document.getElementById('dbg');
  if (!p) return;
  const show = p.style.display === 'none';
  p.style.display = show ? 'block' : 'none';
  if (show) { p.innerHTML = renderLogLines(); p.scrollTop = p.scrollHeight; }
}
function hot(el) { $kw.value = el.textContent; doSearch(); }
function getFilteredLatest() {
  if (latestCat === 'all') return latestAll;
  return latestAll.filter(item => item.category === latestCat);
}

// ── 视图渲染 ──
function renderCard(item, onclickExpr) {
  const pg = getProgress(item.title);
  const srcCount = item.sources?.length || 1;
  const rem = item.remarks || (item.sources?.[0]?.episodes?.length > 1 ? `共${item.sources[0].episodes.length}集` : '');
  return `<div class="cd" onclick="${onclickExpr}">
    <div class="cd-wrap">
      <img class="cd-img" loading="lazy" src="${esc(item.cover) || PH}" onerror="this.src='${PH}'">
      ${srcCount > 1 ? `<div class="cd-src">${srcCount} 源</div>` : ''}
      ${pg ? `<div class="cd-pg">▶ ${formatTime(pg.time)}</div>` : ''}
      ${rem ? `<div class="cd-rem">${esc(rem)}</div>` : ''}
    </div>
    <div class="cd-bd">
      <div class="cd-t">${esc(item.title)}</div>
      <div class="cd-m">${esc(item.snippet || item.year || item.sources?.[0]?.site || '')}</div>
    </div>
  </div>`;
}

function render() {
  document.body.className = 'state-' + state;
  let h = '';

  if (state === 'idle') {
    h += `<div class="hero">
      <div class="tags">${HOT_WORDS.slice(0, 10).map(w => `<span class="tag" onclick="hot(this)">${esc(w)}</span>`).join('')}</div>
      ${searchHistory.length ? `<div class="hist">
        <div class="hist-head"><span>🕐 搜索历史</span><span class="hist-clear" onclick="clearHistory()">清空</span></div>
        <div class="hist-list">${searchHistory.slice(0, 12).map(kw => `<span class="hist-item" data-kw="${esc(kw)}">${esc(kw)}</span>`).join('')}</div>
      </div>` : ''}
    </div>`;

    if (recentFilms.length) {
      h += `<div class="sec">
        <div class="sec-hd">
          <div class="sec-title">▶ 继续观看</div>
          <div class="sec-sub">点击直接续播</div>
        </div>
        <div class="recents">${recentFilms.map((r, i) => {
          const pg = getProgress(r.title);
          const pct = pg?.duration > 0 ? Math.min(100, Math.round((pg.time / pg.duration) * 100)) : 0;
          const label = pg ? `${pg.label || ('第' + (pg.ep + 1) + '集')} · ${formatTime(pg.time)}` : '上次看过';
          return `<div class="rcard" onclick="playRecent(${i})">
            <span class="rcard-del" onclick="removeRecent(${i},event)" title="移除">✕</span>
            <div class="rcard-top">
              <img class="rcard-img" loading="lazy" src="${esc(r.cover) || PH}" onerror="this.src='${PH}'">
              <div class="rcard-info">
                <div class="rcard-t">${esc(r.title)}</div>
                <div class="rcard-m">${esc(label)}</div>
                <div class="rcard-s">${esc(pg?.site || r.sources?.[0]?.site || '')}</div>
              </div>
            </div>
            <div class="rcard-bar"><i style="width:${pct}%"></i></div>
          </div>`;
        }).join('')}</div>
      </div>`;
    }

    const filteredLatest = getFilteredLatest();
    if (latestAll.length) {
      const cats = [
        { id: 'all', name: '全部' },
        { id: 'movie', name: '电影' },
        { id: 'series', name: '剧集' },
        { id: 'anime', name: '动漫' },
        { id: 'variety', name: '综艺' },
      ];
      h += `<div class="sec">
        <div class="sec-hd">
          <div class="sec-title">✨ 最新更新</div>
          <div class="sec-tabs">${cats.map(c => `<button class="stab ${latestCat === c.id ? 'on' : ''}" onclick="setLatestCat('${c.id}')">${c.name}</button>`).join('')}</div>
        </div>
      </div>
      <div class="grid">${filteredLatest.slice(0, 24).map((item, i) => renderCard(item, `playLatest(${i})`)).join('')}</div>`;
    }
  }

  if (state === 'searching') {
    h = `<div class="ld"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="es">正在并发搜索 11 个高速资源站…</div></div>`;
  }

  if (state === 'results') {
    if (!results.length) {
      h = `<div class="nav"><div class="nb" onclick="backToHome()">←</div><div class="nt">搜索结果</div></div>
      <div class="empty"><div class="ei">🫧</div><div class="et">没有找到相关影片</div><div class="es">换个关键词或简短片名试试</div></div>`;
    } else {
      const shown = getFilteredResults();
      const catDefs = [
        { id: 'all', name: '全部' },
        { id: 'movie', name: '电影' },
        { id: 'series', name: '剧集' },
        { id: 'anime', name: '动漫' },
        { id: 'variety', name: '综艺' },
      ];
      const catTabs = catDefs
        .map(c => ({ ...c, count: c.id === 'all' ? results.length : results.filter(r => r.category === c.id).length }))
        .filter(c => c.id === 'all' || c.count > 0);

      h = `<div class="nav">
        <div class="nb" onclick="backToHome()">←</div>
        <div class="nt">精准匹配 ${results.length} 部影片</div>
        ${filteredOutCount > 0 ? `<div class="nt-sub">已过滤 ${filteredOutCount} 条无关内容</div>` : ''}
      </div>
      ${catTabs.length > 2 ? `<div class="sec" style="padding-top:2px;padding-bottom:10px"><div class="sec-tabs">${catTabs.map(c => `<button class="stab ${resultCat === c.id ? 'on' : ''}" onclick="setResultCat('${c.id}')">${c.name} (${c.count})</button>`).join('')}</div></div>` : ''}
      <div class="grid">${shown.map((item, i) => renderCard(item, `selectFilm(${i})`)).join('')}</div>`;
    }
  }

  if (state === 'playing' && film) {
    h = `<div class="play-wrap">
      <div class="nav">
        <div class="nb" onclick="backToResults()">←</div>
        <div class="nt">${esc(film.title)}</div>
        <div class="nt-badges">
          <span id="q-badge" class="q-badge"></span>
          <span class="nt-sub">${esc(eps[curEp]?.label || '')}</span>
        </div>
      </div>
      <div class="ply-outer"><div class="ply"><div id="player-box" style="width:100%;height:100%"></div></div></div>
      <div class="warn">
        <span>⚠️</span>
        <span class="warn-text">视频源自第三方采集站，请勿轻信画面中的任何广告、二维码或联系方式，谨防诈骗！</span>
        <span class="warn-close" onclick="this.parentElement.style.display='none'">✕</span>
      </div>
      <div class="tbar">
        <button id="next-ep-btn" class="pl act" style="${curEp < eps.length - 1 ? '' : 'display:none'}" onclick="playNextEp()">⏭ 下一集</button>
        ${[0.75, 1, 1.25, 1.5, 2, 3].map(s => `<span class="pl ${s === 1 ? 'on' : ''}" data-s="${s}" onclick="setSpeed(${s})">${s}×</span>`).join('')}
      </div>
      <div class="src-bar">
        <div class="src-hd">
          <span>📡 播放线路（绿点直连可用 · 红点已失效）</span>
          <span>${film.sources.length} 条线路</span>
        </div>
        <div class="src-list">${renderSourcePills()}</div>
      </div>
      ${eps.length ? `<div class="ep">
        <div class="eh">
          <h3>选集</h3>
          <div class="eh-right">
            <span id="ep-count">共 ${eps.length} 集</span>
            <button class="sort-btn" style="${eps.length > 1 ? '' : 'display:none'}" onclick="toggleEpSort()">${epReverse ? '↓ 倒序' : '↑ 正序'}</button>
          </div>
        </div>
        <div class="ew">${renderEpisodeButtons()}</div>
      </div>` : ''}
      ${film.blurb ? `<div class="blurb"><b>简介：</b>${esc(film.blurb)}</div>` : ''}
      <div class="kb-hint">快捷键：空格 播放/暂停 · ←/→ 快退/快进10秒 · ↑/↓ 音量 · F 全屏 · N 下一集</div>
      <div class="db"><button onclick="toggleDebug()">展开/收起调试日志</button></div>
      <div class="dbox" id="dbg" style="display:none">${renderLogLines()}</div>
    </div>`;
  }

  $app.innerHTML = h;
}

render();
</script>
